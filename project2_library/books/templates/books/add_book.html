{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" href="{% static 'books/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Add a New Book</h1>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.title.id_for_label }}">Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label for="{{ form.author.id_for_label }}">Author</label>
                {{ form.author }}
            </div>

            <div class="form-group">
                <label for="{{ form.year_published.id_for_label }}">
                    Year Published
                </label>
                {{ form.year_published }}
            </div>

            <div class="checkbox">
                {{ form.is_available }}
                <label for="{{ form.is_available.id_for_label }}">
                    Is available
                </label>
            </div>

            <button type="submit">Save Book</button>

        </form>

        <p>
            <a href="{% url 'book_list' %}">← Back to library</a>
        </p>

    </div>

</body>
</html>
